[project]
name = "breeze-tts2-finetuning"
version = "0.1.0"
description = "Windows-native Breeze TTS 2 fine-tuning and inference tools"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "flash-attn ; sys_platform == 'win32'",
    "numpy>=2.0",
    "python-multipart>=0.0.18",
    "qwen-tts==0.1.1",
    "safetensors>=0.4",
    "soundfile>=0.13",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "transformers==4.57.3",
    "triton-windows>=3.5,<3.6 ; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
evaluation = [
    "faster-whisper>=1.1",
    "librosa>=0.11",
    "speechbrain>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
torchaudio = { index = "pytorch-cu128", marker = "sys_platform == 'win32'" }
flash-attn = { url = "https://github.com/kingbri1/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu128torch2.9.0cxx11abiFALSE-cp312-cp312-win_amd64.whl" }

[tool.pytest.ini_options]
testpaths = ["tests", "training/tests", "evaluation/tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["F", "I"]
